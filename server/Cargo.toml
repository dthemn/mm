[package]
name = "mm-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Stores only encrypted records and minimal metadata."

[lib]
path = "src/lib.rs"

[[bin]]
name = "mm-server"
path = "src/main.rs"

[dependencies]
mm-core.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
axum = "0.8"
getrandom = "0.3"
hex = "0.4"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["fs", "limit", "set-header", "trace"] }
tower_governor = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
webauthn-rs = { version = "0.6", features = ["danger-allow-state-serialisation", "conditional-ui"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
