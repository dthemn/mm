[package]
name = "mm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Models, cryptography and sync logic. Compiles to native and WASM."

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
base64 = "0.22"
bip39 = { version = "2", features = ["zeroize"] }
chacha20poly1305 = "0.10"
getrandom = "0.3"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
# The older version comes in through RustCrypto and must also target the browser.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

[dev-dependencies]
pollster = "0.4"
