# Runs the whole app on this computer: docker compose up --build
# Local testing only. The password is not a secret and ports open only on localhost.
name: mm-local

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mm
      POSTGRES_PASSWORD: mm-local
      POSTGRES_DB: mm
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mm -d mm"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgres://mm:mm-local@db:5432/mm
      RP_ID: localhost
      ORIGIN: http://localhost:8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db:
