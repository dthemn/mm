# Production on one VPS: docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
# Caddy gets a free Let's Encrypt certificate for DOMAIN and renews it.
name: mm-prod

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: mm
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mm -d mm"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build: ..
    environment:
      DATABASE_URL: postgres://mm:${POSTGRES_PASSWORD}@db:5432/mm
      RP_ID: ${DOMAIN:?set DOMAIN in deploy/.env}
      # Only for a local test on another port. On a VPS leave PUBLIC_ORIGIN unset.
      ORIGIN: ${PUBLIC_ORIGIN:-https://${DOMAIN}}
      BEHIND_PROXY: "1"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  db:
  caddy_data:
  caddy_config:
