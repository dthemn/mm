<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>OCR speed</title>
<body style="font:16px system-ui;padding:16px"><h3>On-device OCR speed test</h3>
<p>Only a synthetic receipt is used. Keep this page open until it says "done".</p><pre id=o>starting…</pre>
<script type=module>
const o=document.getElementById('o'), log=m=>{o.textContent+='\n'+m};
const res={ua:navigator.userAgent,cores:navigator.hardwareConcurrency,mem:navigator.deviceMemory,isolated:crossOriginIsolated};
const blob=async u=>{const r=await fetch(u); if(!r.ok) throw new Error(u+' '+r.status); return r};
async function image(){
  const b=await createImageBitmap(await (await blob('/asset/receipt.jpg')).blob());
  const c=new OffscreenCanvas(b.width,b.height), x=c.getContext('2d'); x.drawImage(b,0,0);
  return x.getImageData(0,0,b.width,b.height);
}
try{
  const img=await image();
  // --- Tesseract WASM in a worker
  const {OCRClient}=await import('/dep/tesseract-wasm/dist/lib.js');
  const c=new OCRClient({workerURL:'/dep/tesseract-wasm/dist/tesseract-worker.js',wasmBinary:await (await blob('/dep/tesseract-wasm/dist/tesseract-core.wasm')).arrayBuffer()});
  await c.loadModel('/asset/pol_fast.traineddata');
  let t=performance.now(); await c.loadImage(img); const w=await c.getTextBoxes('word');
  res.tess_s=(performance.now()-t)/1000; res.tess_words=w.length; c.destroy(); log('tesseract '+res.tess_s.toFixed(2)+' s');
  // --- PP-OCR through onnxruntime-web
  const ort=await import('/dep/onnxruntime-web/dist/ort.wasm.min.mjs');
  ort.env.wasm.wasmPaths='/dep/onnxruntime-web/dist/';
  const q=+new URLSearchParams(location.search).get('th');
  // ORT reads numThreads once per page load: set the thread count with ?th=N
  for(const th of [q||(crossOriginIsolated?4:1)]){
    ort.env.wasm.numThreads=th;
    const det=await ort.InferenceSession.create('/asset/det.onnx',{executionProviders:['wasm']});
    const rec=await ort.InferenceSession.create('/asset/rec.onnx',{executionProviders:['wasm']});
    const H=960,W=640,N=45; // a receipt: one detector pass and about 45 lines
    const ten=(h,w)=>new ort.Tensor('float32',new Float32Array(3*h*w).fill(.1),[1,3,h,w]);
    t=performance.now(); await det.run({[det.inputNames[0]]:ten(H,W)}); const d=(performance.now()-t)/1000;
    const one=ten(48,320); t=performance.now();
    for(let i=0;i<N;i++) await rec.run({[rec.inputNames[0]]:one});
    const r=(performance.now()-t)/1000;
    res['pp_det_'+th]=d; res['pp_rec45_'+th]=r; res['pp_total_'+th]=d+r; log('pp-ocr x'+th+' '+(d+r).toFixed(2)+' s');
    await det.release(); await rec.release();
  }
}catch(e){res.error=String(e); log('error '+e)}
await fetch('/result',{method:'POST',body:JSON.stringify(res)});
log('done');
</script>
